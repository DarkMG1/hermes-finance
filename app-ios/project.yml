name: Hermes
options:
  bundleIdPrefix: dev.darkmg1
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "210"
packages:
  HermesKit:
    path: HermesKit
targets:
  Hermes:
    type: application
    platform: iOS
    sources: [Hermes]
    dependencies:
      - package: HermesKit
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: Hermes/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Apple Card CSV
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text]
        LSSupportsOpeningDocumentsInPlace: false
        NSFaceIDUsageDescription: Unlock Hermes with Face ID
        NSCameraUsageDescription: Take a photo of a receipt.
        UILaunchScreen: {}
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: snapReceipt
            UIApplicationShortcutItemTitle: Snap receipt
            UIApplicationShortcutItemIconSymbolName: camera
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.darkmg1.hermesfinance
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
schemes:
  Hermes:
    build:
      targets:
        Hermes: all
    # Release without the debugger by default: the Debug build lags on keyboard focus.
    # Switch Run back to Debug and turn debugEnabled on when you need the debugger.
    run:
      config: Release
      debugEnabled: false
    archive:
      config: Release

name: Hermes
options:
  bundleIdPrefix: dev.darkmg1
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HermesKit:
    path: HermesKit
targets:
  Hermes:
    type: application
    platform: iOS
    sources: [Hermes]
    dependencies:
      - package: HermesKit
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: Hermes/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.darkmg1.hermesfinance
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
schemes:
  Hermes:
    build:
      targets:
        Hermes: all
    # Release by default: the Debug build lags on keyboard focus. Switch Run back to Debug when you need the debugger.
    run:
      config: Release
    archive:
      config: Release
